# Production release: build the nginx image and push to Azure Container Registry (ACR).
#
# Branch workflow (intended):
#   • Develop and commit on `dev` (optional CI: npm build — see ci-dev.yml).
#   • When ready for production, merge `dev` → `master` or `main` (your prod branch).
#   • This workflow runs ONLY on pushes to `master`/`main`, not on `dev`.
#
# Prerequisites (Azure Portal or az CLI):
#   1. Create a Container Registry (e.g. myregistry.azurecr.io).
#   2. Enable admin user OR use a service principal with AcrPush on that registry.
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   ACR_LOGIN_SERVER        — e.g. myregistry.azurecr.io
#   ACR_USERNAME            — registry username (admin user name or SP app id)
#   ACR_PASSWORD            — registry password (admin password or SP secret)
#   AZURE_CREDENTIALS       — service principal JSON (see Azure/login README): subscriptionId,
#                             tenantId, clientId, clientSecret — role must allow updating the app
#   AZURE_RESOURCE_GROUP    — e.g. aiwellbeing-rg
#   AZURE_CONTAINER_APP_NAME — e.g. aiwellbeing-app
#
# Optional (baked into Vite build inside the image):
#   VITE_MSAL_CLIENT_ID
#   VITE_MSAL_AUTHORITY
#   VITE_MSAL_AUTHORITY_SIGNUP
#
# env.IMAGE_NAME below must match your ACR repository name (e.g. aiwellbeing-app).
#
# After ACR push: this workflow updates Azure Container Apps so production serves the new
# revision immediately (same commit as the image digest).

name: Build, push to ACR, deploy Container App

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  IMAGE_NAME: aiwellbeing-app

jobs:
  build-push-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        id: docker_build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_MSAL_CLIENT_ID=${{ secrets.VITE_MSAL_CLIENT_ID }}
            VITE_MSAL_AUTHORITY=${{ secrets.VITE_MSAL_AUTHORITY }}
            VITE_MSAL_AUTHORITY_SIGNUP=${{ secrets.VITE_MSAL_AUTHORITY_SIGNUP }}

      - name: Azure login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy Container App (new revision)
        run: |
          set -euo pipefail
          az extension add --name containerapp --upgrade --yes
          IMAGE_REF="${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}@${{ steps.docker_build.outputs.digest }}"
          echo "Updating Container App with image: ${IMAGE_REF}"
          az containerapp update \
            --resource-group "${{ secrets.AZURE_RESOURCE_GROUP }}" \
            --name "${{ secrets.AZURE_CONTAINER_APP_NAME }}" \
            --image "${IMAGE_REF}"
