# Build the nginx image from Dockerfile and push to Azure Container Registry (ACR).
#
# Prerequisites (Azure Portal or az CLI):
#   1. Create a Container Registry (e.g. myregistry.azurecr.io).
#   2. Enable admin user OR use a service principal with AcrPush on that registry.
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   ACR_LOGIN_SERVER   — e.g. myregistry.azurecr.io
#   ACR_USERNAME       — registry username (admin user name or SP app id)
#   ACR_PASSWORD       — registry password (admin password or SP secret)
#
# Optional (baked into Vite build inside the image):
#   VITE_MSAL_CLIENT_ID
#   VITE_MSAL_AUTHORITY
#   VITE_MSAL_AUTHORITY_SIGNUP
#
# After push: deploy this image from ACR in Azure Container Apps, Web App for Containers,
# or AKS — Static Web Apps does not run Docker images.

name: Push Docker image to Azure Container Registry

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  IMAGE_NAME: ai-wellbeing-web

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_MSAL_CLIENT_ID=${{ secrets.VITE_MSAL_CLIENT_ID }}
            VITE_MSAL_AUTHORITY=${{ secrets.VITE_MSAL_AUTHORITY }}
            VITE_MSAL_AUTHORITY_SIGNUP=${{ secrets.VITE_MSAL_AUTHORITY_SIGNUP }}
