# Production release: build the nginx image and push to Azure Container Registry (ACR).
#
# Branch workflow (intended):
#   • Develop and commit on `dev` (optional CI: npm build — see ci-dev.yml).
#   • When ready for production, merge `dev` → `master` or `main` (your prod branch).
#   • This workflow runs ONLY on pushes to `master`/`main`, not on `dev`.
#
# Prerequisites (Azure Portal or az CLI):
#   1. Create a Container Registry (e.g. myregistry.azurecr.io).
#   2. Enable admin user OR use a service principal with AcrPush on that registry.
#
# GitHub repo secrets (Settings → Secrets and variables → Actions):
#   ACR_LOGIN_SERVER   — e.g. myregistry.azurecr.io
#   ACR_USERNAME       — registry username (admin user name or SP app id)
#   ACR_PASSWORD       — registry password (admin password or SP secret)
#
# Optional (baked into Vite build inside the image):
#   VITE_MSAL_CLIENT_ID
#   VITE_MSAL_AUTHORITY
#   VITE_MSAL_AUTHORITY_SIGNUP
#
# env.IMAGE_NAME below must match your ACR repository name (e.g. aiwellbeing-app).
#
# After ACR push: update Azure Container Apps (or your runtime) to pull the new tag/digest
# (e.g. `latest` or `sha-<git-sha>`), unless you have registry webhooks / CD wired separately.

name: Push Docker image to Azure Container Registry

on:
  push:
    branches: [master, main]
  workflow_dispatch:

env:
  IMAGE_NAME: aiwellbeing-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Log in to Azure Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Docker meta (tags)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ secrets.ACR_LOGIN_SERVER }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_MSAL_CLIENT_ID=${{ secrets.VITE_MSAL_CLIENT_ID }}
            VITE_MSAL_AUTHORITY=${{ secrets.VITE_MSAL_AUTHORITY }}
            VITE_MSAL_AUTHORITY_SIGNUP=${{ secrets.VITE_MSAL_AUTHORITY_SIGNUP }}
