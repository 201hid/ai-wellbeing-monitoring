# Validates builds on the development branch without publishing images or touching Azure.
# Merge `dev` → `master`/`main` to run the deploy workflow (Docker build + ACR push).

name: CI (dev branch)

on:
  push:
    branches: [dev]
  pull_request:
    branches: [dev]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install and build
        run: npm ci && npm run build
